<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 面料智能重着色工具</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="/main.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <h2 class="sidebar-title">操作区</h2>

    <div class="section">
      <h3>款式选择 <span id="style-count"></span></h3>
      <div id="style-grid" class="style-grid style-grid-compact"></div>
    </div>

    <div class="section">
      <h3>面料选择 <span id="fabric-count"></span></h3>
      <div id="fabric-grid" class="fabric-grid"></div>
    </div>

    <div id="palette-section" class="section hidden">
      <div class="section-head">
        <h3>调色板</h3>
        <select id="palette-mode" class="compact-select">
          <option value="landscape">风景图片</option>
          <option value="manual">色块</option>
        </select>
      </div>

      <div id="landscape-picker" class="palette-source">
        <div class="picker-head">
          <span>风景参考 <span id="landscape-count"></span></span>
          <button id="use-current-palette" class="ghost-btn" type="button">取当前风景色</button>
        </div>
        <div id="landscape-grid" class="style-grid"></div>
      </div>

      <div id="manual-palette-editor" class="palette-source hidden">
        <div class="picker-head">
          <span>色块编辑</span>
          <button id="sync-manual-palette" class="ghost-btn" type="button">同步当前色板</button>
        </div>
        <div id="manual-palette" class="manual-palette"></div>
      </div>

      <div id="extracted-palette" class="palette-display"></div>
    </div>

    <button id="recolor-btn" class="primary-btn" disabled>开始执行</button>
    <div id="service-status" class="status-text">正在连接服务...</div>
  </aside>

  <main class="content">
    <h1 class="main-title">AI 面料智能重着色工具</h1>

    <div id="results" class="results hidden">
      <div class="result-col">
        <h3>原始效果</h3>
        <img id="result-original" alt="原始款式预览" />
      </div>
      <div class="result-col">
        <h3>换色结果</h3>
        <img id="result-recolor" alt="重着色结果" />
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p id="loading-text">AI 正在着色，请稍候...</p>
    </div>

    <div id="placeholder" class="placeholder">
      <p>选择款式和面料，然后点击「开始执行」</p>
    </div>

    <button id="save-btn" class="save-btn hidden">保存结果</button>
  </main>
</body>
</html>
